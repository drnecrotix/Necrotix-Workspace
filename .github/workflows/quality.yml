name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/necrotix_workspace
          ADMIN_ACCESS_KEY: ci-admin-access-key-long-enough
          NECROTIX_HANDOFF_SECRET: ci-handoff-secret-that-is-at-least-thirty-two
